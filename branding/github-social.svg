<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="mp3-to-m4b — сборка аудиокниг: MP3 в M4B для macOS">
  <defs>
    <!-- ===== background: deep dark premium panel, cool cyan/teal family (not fb2-warm) ===== -->
    <!-- userSpaceOnUse over the 1280x640 canvas so the cool core stays anchored
         and the gradient darkens smoothly to every edge, no seams. -->
    <radialGradient id="g-base" gradientUnits="userSpaceOnUse" cx="462" cy="300" r="820">
      <stop offset="0%"   stop-color="#15212B"/>
      <stop offset="42%"  stop-color="#0D151D"/>
      <stop offset="74%"  stop-color="#0A1017"/>
      <stop offset="100%" stop-color="#070B10"/>
    </radialGradient>
    <radialGradient id="g-edge" gradientUnits="userSpaceOnUse" cx="462" cy="300" r="780">
      <stop offset="56%"  stop-color="#0E5A66" stop-opacity="0"/>
      <stop offset="100%" stop-color="#136B86" stop-opacity="0.38"/>
    </radialGradient>
    <!-- subtle indigo hint in the bottom-right corner (depth, family gradient tail) -->
    <radialGradient id="g-indigocorner" gradientUnits="userSpaceOnUse" cx="1180" cy="620" r="480">
      <stop offset="0%"   stop-color="#4A6BFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4A6BFF" stop-opacity="0"/>
    </radialGradient>
    <!-- cool bloom behind the wordmark / center (alpha-radial, NO blur filters:
         cairosvg-safe, renders identically everywhere) -->
    <radialGradient id="g-coolbloom" gradientUnits="userSpaceOnUse" cx="482" cy="300" r="520">
      <stop offset="0%"   stop-color="#1FB8D8" stop-opacity="0.20"/>
      <stop offset="55%"  stop-color="#22B5E0" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#22B5E0" stop-opacity="0"/>
    </radialGradient>

    <!-- ===== icon tile internals (from icon-app.svg family panel) ===== -->
    <radialGradient id="ic-bg" cx="50%" cy="38%" r="92%">
      <stop offset="0%"   stop-color="#15212B"/>
      <stop offset="55%"  stop-color="#0C141C"/>
      <stop offset="100%" stop-color="#070B10"/>
    </radialGradient>
    <radialGradient id="ic-edgeglow" cx="50%" cy="54%" r="62%">
      <stop offset="60%"  stop-color="#0E5A66" stop-opacity="0"/>
      <stop offset="100%" stop-color="#136B86" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="ic-toprim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="45%"  stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- blooms behind the symbol — alpha-radials instead of blurred ellipses -->
    <radialGradient id="ic-bloomA" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1FB8D8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#1FB8D8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ic-bloomB" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#4A6BFF" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#4A6BFF" stop-opacity="0"/>
    </radialGradient>
    <!-- soft shadow under the tile / under the book (alpha-radial, no feDropShadow) -->
    <radialGradient id="g-softshadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- tight glow behind the play triangle -->
    <radialGradient id="g-playglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7FF3E8" stop-opacity="0.30"/>
      <stop offset="70%"  stop-color="#7FF3E8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#7FF3E8" stop-opacity="0"/>
    </radialGradient>
    <!-- glow behind the wordmark arrow -->
    <radialGradient id="g-arrowglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#34E0D2" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#34E0D2" stop-opacity="0"/>
    </radialGradient>

    <!-- ===== signature audio gradients: cyan -> teal -> indigo ===== -->
    <linearGradient id="ia-audio" x1="14%" y1="8%" x2="86%" y2="96%">
      <stop offset="0%"  stop-color="#34E0D2"/>
      <stop offset="46%" stop-color="#22B5E0"/>
      <stop offset="100%" stop-color="#4A6BFF"/>
    </linearGradient>
    <linearGradient id="ia-audio2" x1="14%" y1="8%" x2="86%" y2="96%">
      <stop offset="0%"  stop-color="#2BC8C6"/>
      <stop offset="46%" stop-color="#1EA6D2"/>
      <stop offset="100%" stop-color="#3F5DF0"/>
    </linearGradient>
    <linearGradient id="ia-play" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DDFBFF"/>
    </linearGradient>
    <!-- wordmark m4b: teal -> indigo (mirrors logo.svg lg-m4b), pinned in user space -->
    <linearGradient id="grad-m4b" gradientUnits="userSpaceOnUse" x1="900" y1="201" x2="1140" y2="309">
      <stop offset="0%"  stop-color="#22B5E0"/>
      <stop offset="100%" stop-color="#4A6BFF"/>
    </linearGradient>
    <!-- arrow: cyan -> teal, pinned across the arrow span -->
    <linearGradient id="grad-arrow" gradientUnits="userSpaceOnUse" x1="766" y1="259" x2="852" y2="259">
      <stop offset="0%"  stop-color="#34E0D2"/>
      <stop offset="100%" stop-color="#22B5E0"/>
    </linearGradient>
    <!-- waveform strip: brand gradient across the whole strip -->
    <linearGradient id="grad-wave" gradientUnits="userSpaceOnUse" x1="486" y1="540" x2="1091" y2="540">
      <stop offset="0%"  stop-color="#34E0D2"/>
      <stop offset="50%" stop-color="#22B5E0"/>
      <stop offset="100%" stop-color="#4A6BFF"/>
    </linearGradient>

    <!-- faint top highlight, gradient fade (a solid band leaves a visible seam at its edge) -->
    <linearGradient id="g-topband" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- squircle-ish rounded square tile clip (300x300, corner radius 66 ~ 22%) -->
    <clipPath id="clip-tile">
      <rect x="0" y="0" width="300" height="300" rx="66" ry="66"/>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>

  <!-- ============================ BACKGROUND (full-bleed) ============================ -->
  <rect x="0" y="0" width="1280" height="640" fill="#070B10"/>
  <rect x="0" y="0" width="1280" height="640" fill="url(#g-base)"/>
  <rect x="0" y="0" width="1280" height="640" fill="url(#g-edge)"/>
  <rect x="0" y="0" width="1280" height="640" fill="url(#g-indigocorner)"/>
  <ellipse cx="482" cy="300" rx="520" ry="340" fill="url(#g-coolbloom)"/>
  <!-- faint top highlight band (fades out, no seam) -->
  <rect x="0" y="0" width="1280" height="140" fill="url(#g-topband)"/>
  <!-- 1px premium inner hairline -->
  <rect x="0.5" y="0.5" width="1279" height="639" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>

  <!-- ============================ ICON TILE (squircle 300x300, center at 242,320) ============================ -->
  <!-- soft shadow under the tile (alpha-radial ellipse, no filters) -->
  <ellipse cx="242" cy="484" rx="205" ry="56" fill="url(#g-softshadow)"/>
  <g transform="translate(92,170)">
    <g clip-path="url(#clip-tile)">
      <!-- internal full-bleed dark background -->
      <rect x="0" y="0" width="300" height="300" fill="#070B10"/>
      <rect x="0" y="0" width="300" height="300" fill="url(#ic-bg)"/>
      <rect x="0" y="0" width="300" height="300" fill="url(#ic-edgeglow)"/>
      <!-- straight top-edge sheen (family rule: no crescent) -->
      <rect x="0" y="0" width="300" height="94" fill="url(#ic-toprim)"/>
      <!-- glow blooms behind the symbol -->
      <ellipse cx="150" cy="152" rx="126" ry="132" fill="url(#ic-bloomA)"/>
      <ellipse cx="184" cy="176" rx="82"  ry="88"  fill="url(#ic-bloomB)"/>

      <!-- SYMBOL: open book + play triangle (icon-app.svg motif, authored on 1024).
           Visual mass centers at (512,541). Map into the 300 tile so that point
           lands at (150,150): s=0.33, tx=150-0.33*512=-18.96, ty=150-0.33*541=-28.53. -->
      <g transform="matrix(0.33,0,0,0.33,-18.96,-28.53)">
        <!-- grounding shadow under the book -->
        <ellipse cx="512" cy="800" rx="250" ry="46" fill="url(#g-softshadow)"/>
        <!-- left leaf -->
        <path d="M512 322
                 C 470 290, 410 280, 352 290
                 C 328 294, 314 312, 314 336
                 L 314 700
                 C 314 722, 332 736, 354 732
                 C 410 722, 470 730, 512 760
                 Z" fill="url(#ia-audio)"/>
        <!-- right leaf -->
        <path d="M512 322
                 C 554 290, 614 280, 672 290
                 C 696 294, 710 312, 710 336
                 L 710 700
                 C 710 722, 692 736, 670 732
                 C 614 722, 554 730, 512 760
                 Z" fill="url(#ia-audio2)"/>
        <!-- spine seam -->
        <rect x="508" y="322" width="8" height="430" rx="4" fill="#0A0F16" opacity="0.35"/>
        <!-- page lines (left) -->
        <g stroke="#FFFFFF" stroke-opacity="0.40" stroke-width="14" stroke-linecap="round">
          <line x1="372" y1="392" x2="456" y2="399"/>
          <line x1="372" y1="452" x2="452" y2="459"/>
        </g>
        <!-- page lines (right), shortened clear of the play -->
        <g stroke="#FFFFFF" stroke-opacity="0.40" stroke-width="14" stroke-linecap="round">
          <line x1="612" y1="395" x2="652" y2="391"/>
          <line x1="612" y1="455" x2="652" y2="451"/>
        </g>
        <!-- tight glow + dark backing disc + play triangle on the spine -->
        <ellipse cx="512" cy="546" rx="160" ry="160" fill="url(#g-playglow)"/>
        <circle cx="512" cy="546" r="104" fill="#0B1118" opacity="0.55"/>
        <path d="M474 482 L474 610 L586 546 Z" fill="url(#ia-play)"/>
      </g>
    </g>
    <!-- inner top rim highlight on the tile glass -->
    <rect x="1" y="1" width="298" height="298" rx="65" ry="65"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
  </g>

  <!-- ============================ WORDMARK (right of icon) ============================ -->
  <!-- baseline group: whole right block (wordmark..badge) centered on canvas mid y=320. "mp3"  ->  "m4b" -->
  <text x="482" y="299" class="sans" font-size="120" font-weight="800" letter-spacing="-4" fill="#EAF6FA">mp3</text>

  <!-- VECTOR arrow (cyan->teal), solid fills only (no strokes under filters).
       Solid triangular head deliberately echoes the play triangle of the mark. -->
  <ellipse cx="811" cy="259" rx="80" ry="38" fill="url(#g-arrowglow)"/>
  <rect x="766" y="252" width="52" height="14" rx="7" fill="url(#grad-arrow)"/>
  <path d="M814 231 L852 259 L814 287 Z" fill="url(#grad-arrow)"/>

  <text x="900" y="299" class="sans" font-size="120" font-weight="800" letter-spacing="-4" fill="url(#grad-m4b)">m4b</text>

  <!-- ============================ TAGLINE ============================ -->
  <!-- the "->" is a VECTOR mini-arrow (solid fills): fallback fonts lack the U+2192 glyph
       next to Cyrillic and render tofu in cairosvg. Text ink measured: ends at x=902. -->
  <text x="484" y="365" class="sans" font-size="36" font-weight="500" letter-spacing="0.2" fill="#B7D4E0">&#1057;&#1073;&#1086;&#1088;&#1082;&#1072; &#1072;&#1091;&#1076;&#1080;&#1086;&#1082;&#1085;&#1080;&#1075; &#183; MP3</text>
  <g fill="#34E0D2" opacity="0.85">
    <rect x="916" y="349" width="24" height="6" rx="3"/>
    <path d="M936 341 L952 352 L936 363 Z"/>
  </g>
  <text x="966" y="365" class="sans" font-size="36" font-weight="500" letter-spacing="0.2" fill="#B7D4E0">M4B</text>

  <!-- ============================ BADGE + FOOTER URL (one row) ============================ -->
  <rect x="484" y="383" width="154" height="42" rx="21"
        fill="#34E0D2" fill-opacity="0.07" stroke="#34E0D2" stroke-opacity="0.40" stroke-width="1.5"/>
  <text x="561" y="411" text-anchor="middle" class="sans" font-size="21" font-weight="600" letter-spacing="0.5" fill="#CFEFF0">&#1076;&#1083;&#1103; macOS</text>
  <text x="666" y="411" class="sans" font-size="24" font-weight="500" letter-spacing="0.3" fill="#74909E">github.com/ArrivaRUS/mp3-to-m4b</text>

  <!-- ============================ AUDIO WAVEFORM STRIP (MP3 motif, fades right) ============================ -->
  <!-- solid rounded bars, per-bar opacity fade — no filters, downscale-safe.
       translate(0,-16): keeps the strip balanced under the raised text block
       (grad-wave is horizontal, x-anchored — the y shift can't affect the fill). -->
  <g fill="url(#grad-wave)" transform="translate(0,-16)">
    <rect x="486"  y="532" width="7" height="16" rx="3.5" opacity="0.45"/>
    <rect x="512"  y="525" width="7" height="30" rx="3.5" opacity="0.43"/>
    <rect x="538"  y="518" width="7" height="44" rx="3.5" opacity="0.42"/>
    <rect x="564"  y="525" width="7" height="30" rx="3.5" opacity="0.40"/>
    <rect x="590"  y="531" width="7" height="18" rx="3.5" opacity="0.39"/>
    <rect x="616"  y="522" width="7" height="36" rx="3.5" opacity="0.37"/>
    <rect x="642"  y="516" width="7" height="48" rx="3.5" opacity="0.35"/>
    <rect x="668"  y="527" width="7" height="26" rx="3.5" opacity="0.34"/>
    <rect x="694"  y="533" width="7" height="14" rx="3.5" opacity="0.32"/>
    <rect x="720"  y="525" width="7" height="30" rx="3.5" opacity="0.31"/>
    <rect x="746"  y="520" width="7" height="40" rx="3.5" opacity="0.29"/>
    <rect x="772"  y="530" width="7" height="20" rx="3.5" opacity="0.27"/>
    <rect x="798"  y="524" width="7" height="32" rx="3.5" opacity="0.26"/>
    <rect x="824"  y="517" width="7" height="46" rx="3.5" opacity="0.24"/>
    <rect x="850"  y="531" width="7" height="18" rx="3.5" opacity="0.23"/>
    <rect x="876"  y="527" width="7" height="26" rx="3.5" opacity="0.21"/>
    <rect x="902"  y="521" width="7" height="38" rx="3.5" opacity="0.19"/>
    <rect x="928"  y="532" width="7" height="16" rx="3.5" opacity="0.18"/>
    <rect x="954"  y="528" width="7" height="24" rx="3.5" opacity="0.16"/>
    <rect x="980"  y="523" width="7" height="34" rx="3.5" opacity="0.15"/>
    <rect x="1006" y="533" width="7" height="14" rx="3.5" opacity="0.13"/>
    <rect x="1032" y="529" width="7" height="22" rx="3.5" opacity="0.11"/>
    <rect x="1058" y="525" width="7" height="30" rx="3.5" opacity="0.10"/>
    <rect x="1084" y="534" width="7" height="12" rx="3.5" opacity="0.08"/>
  </g>
</svg>
